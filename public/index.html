<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JED</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
        integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI"
        crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f5f5f7; color: #1d1d1f; min-height: 100vh; }

  header { background: #1d1d1f; color: #fff; padding: 16px 24px;
           display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  #breadcrumb { font-size: 0.9rem; color: #aaa; }
  #breadcrumb a { color: #aaa; text-decoration: none; cursor: pointer; }
  #breadcrumb a:hover { color: #fff; }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px 100px;
               transition: margin-right .3s ease; }
  .container.preview-open { margin-right: 50%; max-width: none; }

  /* setup banner */
  .setup-banner { background: #fff; border-radius: 12px; padding: 28px;
                  box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .setup-banner h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
  .setup-banner p { font-size: 0.92rem; color: #444; margin-bottom: 16px; line-height: 1.6; }
  .bookmarklet-btn { display: inline-block; background: #007aff; color: #fff;
                     padding: 11px 20px; border-radius: 8px; text-decoration: none;
                     font-weight: 600; font-size: 0.95rem; cursor: grab; }
  .bookmarklet-btn:hover { background: #0060df; }
  .setup-steps { font-size: 0.9rem; color: #555; margin-top: 12px;
                 padding-left: 20px; line-height: 1.9; }
  .hint { font-size: 0.82rem; color: #888; margin-top: 16px; line-height: 1.5; }
  .setup-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid #eee; }
  .setup-section:first-of-type { border-top: none; padding-top: 4px; margin-top: 8px; }
  .setup-section h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
  .setup-section > p { font-size: 0.9rem; color: #444; margin-bottom: 12px; line-height: 1.55; }
  .code-box { position: relative; margin-top: 10px; }
  .code-box textarea { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                       font-size: 0.76rem; line-height: 1.5; padding: 12px; padding-top: 40px;
                       border: 1px solid #ddd; border-radius: 8px; background: #f8f8fa; color: #333;
                       resize: vertical; white-space: pre; }
  .copy-btn { position: absolute; top: 8px; right: 8px; background: #007aff; color: #fff; border: none;
              padding: 6px 13px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
  .copy-btn:hover { background: #0060df; }

  /* song list */
  .song { background: #fff; border-radius: 12px; margin-bottom: 16px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
  .song-header { display: flex; align-items: center; gap: 12px;
                 padding: 16px 20px; background: #fafafa;
                 border-bottom: 1px solid #e8e8e8; }
  .song-num { font-size: 0.8rem; color: #999; min-width: 20px; }
  .song-name { font-weight: 600; flex: 1; }
  .pdf-list { padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; }
  .pdf-row { display: flex; align-items: center; gap: 10px; }
  .pdf-row input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: #007aff; }
  .pdf-link { font-size: 0.9rem; color: #007aff; cursor: pointer; flex: 1;
              text-decoration: underline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .no-pdf { font-size: 0.85rem; color: #999; padding: 12px 20px; }

  .footnote { font-size: 0.78rem; color: #aaa; text-align: center; margin-top: 24px; line-height: 1.5; }

  /* OnSong sync (iPad / iPhone only) */
  .onsong-card { background: #fff; border-radius: 12px; margin-bottom: 20px; padding: 16px 20px;
                 box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .onsong-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .onsong-text { flex: 1; min-width: 220px; font-size: 0.88rem; color: #555; line-height: 1.5; }
  .onsong-text strong { display: block; font-size: 0.95rem; color: #1d1d1f; }
  .onsong-btn { background: #007aff; color: #fff; padding: 10px 20px; border-radius: 8px;
                font-size: 0.95rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .onsong-btn:hover { background: #0060df; }
  .onsong-btn.disabled { background: #aaa; pointer-events: none; }
  .onsong-again { font-size: 0.82rem; color: #007aff; text-decoration: none; margin-top: 8px; display: inline-block; }
  .onsong-warn { font-size: 0.85rem; color: #b35900; margin-top: 10px; line-height: 1.5; }
  .onsong-charts { padding: 0 20px 12px; display: flex; flex-direction: column; gap: 4px; }
  .onsong-charts:empty { display: none; }
  .onsong-chart { font-size: 0.85rem; color: #555; display: flex; gap: 8px; align-items: baseline; }
  .onsong-chart .badge { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 10px;
                         white-space: nowrap; }
  .badge.found { background: #e3f5e8; color: #1a7f37; }
  .badge.import { background: #e5f0ff; color: #0060df; }
  .badge.missing { background: #fdecea; color: #c62828; }
  .badge.loading { background: #eee; color: #777; }

  /* PDF preview panel */
  #preview-panel { position: fixed; top: 0; right: -50%; width: 48%; height: 100vh;
                   background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,.15);
                   transition: right .3s ease; z-index: 100; display: flex; flex-direction: column; }
  #preview-panel.open { right: 0; }
  #preview-header { padding: 16px 20px; display: flex; align-items: center;
                    border-bottom: 1px solid #e8e8e8; gap: 12px; }
  #preview-title { flex: 1; font-weight: 600; font-size: 0.95rem;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #preview-close { background: none; border: none; font-size: 1.4rem;
                   cursor: pointer; color: #666; line-height: 1; }
  #preview-frame { flex: 1; border: none; }

  /* bottom bar */
  #action-bar { position: fixed; bottom: 0; left: 0; right: 0;
                background: #fff; border-top: 1px solid #e8e8e8;
                padding: 14px 24px; display: flex; align-items: center;
                gap: 16px; transform: translateY(100%);
                transition: transform .25s, right .3s ease; }
  #action-bar.visible { transform: translateY(0); }
  #action-bar.preview-open { right: 50%; }
  #selected-count { font-size: 0.9rem; color: #666; }
  #download-btn { margin-left: auto; background: #007aff; color: #fff;
                  border: none; padding: 10px 22px; border-radius: 8px;
                  font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  #download-btn:hover { background: #0060df; }
  #download-btn:disabled { background: #aaa; cursor: default; }
  #dl-status { font-size: 0.85rem; color: #666; }

  .spinner { display: inline-block; width: 16px; height: 16px;
             border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
             border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div>
    <h1>JED</h1>
    <div id="breadcrumb"></div>
  </div>
</header>

<div class="container" id="main"></div>

<div id="preview-panel">
  <div id="preview-header">
    <span id="preview-title"></span>
    <button id="preview-close" onclick="closePreview()">&#x2715;</button>
  </div>
  <iframe id="preview-frame" src=""></iframe>
</div>

<div id="action-bar">
  <span id="selected-count"></span>
  <span id="dl-status"></span>
  <button id="download-btn" onclick="downloadCombined()">Download Combined PDF</button>
</div>

<script>
let plan = null;          // {name, date, songs:[{name, pdfs:[{name,url}], charts:[{name,url}]}]}
let selectedPdfs = [];    // [{name,url}] in service order

// ── bookmarklet ───────────────────────────────────────────────────────────────
// Built from the page's own origin so it always points back to wherever this is hosted.
function buildBookmarklet(origin) {
  const src = `(function(){
    var el=document.querySelector('[x-data]');
    var p=el&&el._x_dataStack&&el._x_dataStack[0]&&el._x_dataStack[0].store&&el._x_dataStack[0].store.plan;
    if(!p||!p.items){alert('Open a ChurchSuite plan page first, and let it finish loading.');return;}
    var date=p.dateTimeStart?JSON.stringify(p.dateTimeStart).slice(1,11):'';
    var chartExts=['chordpro','cho','chopro','crd','pro'];
    var songs=p.items.filter(function(i){return i.song;}).map(function(i){
      var files=Object.values(i.userFiles||{});
      var pick=function(ok){return files.filter(function(f){return ok((f.extension||'').toLowerCase());}).map(function(f){return {name:f.name,url:f.url};});};
      return {name:i.name,pdfs:pick(function(e){return e==='pdf';}),charts:pick(function(e){return chartExts.indexOf(e)>=0;})};
    });
    var data={name:p.name||'Service',date:date,songs:songs};
    var enc=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
    window.location='${origin}/#'+enc;
  })();`;
  return 'javascript:' + encodeURIComponent(src);
}

// ── routing ───────────────────────────────────────────────────────────────────
// The hash is "<plan>" or, when OnSong sends its library back, "<plan>&onsong=<base64>".
function planHash() {
  return location.hash.slice(1).split('&onsong=')[0];
}

function decodeHash() {
  const h = planHash();
  if (!h) return null;
  try {
    return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h)))));
  } catch (e) {
    return null;
  }
}

function route() {
  selectedPdfs = [];
  updateActionBar();
  closePreview();
  const returned = takeOnSongReturn();
  plan = decodeHash();
  if (plan && plan.songs) {
    renderPlan();
    initOnSong(returned);
  } else {
    renderSetup();
  }
}

// ── setup / installer view ────────────────────────────────────────────────────
function renderSetup() {
  setBreadcrumb([]);
  document.getElementById('main').innerHTML = `
    <div class="setup-banner">
      <h2>Set up JED</h2>
      <p>JED reads the music PDFs straight from your ChurchSuite service plan. It needs a quick one-time setup &mdash; choose your device below.</p>

      <div class="setup-section">
        <h3>&#128187; On a computer</h3>
        <p>Drag this button onto your bookmarks bar:</p>
        <a class="bookmarklet-btn" id="bm">&#128278; Import Plan PDFs</a>
        <ol class="setup-steps">
          <li>Drag <strong>Import Plan PDFs</strong> up to your bookmarks bar</li>
          <li>Open your service plan in ChurchSuite (same browser) and let it finish loading</li>
          <li>Click the bookmark &mdash; you'll come back here with every song's PDFs ready to preview, pick and combine</li>
        </ol>
      </div>

      <div class="setup-section">
        <h3>&#128241; On an iPad or iPhone (Safari)</h3>
        <p>You can't drag a button to a bookmarks bar on iOS, so create the bookmark by hand and paste this code in as its address:</p>
        <div class="code-box">
          <button class="copy-btn" id="copyBmCode" type="button">Copy bookmark code</button>
          <textarea id="bmCode" readonly spellcheck="false" rows="4" style="white-space: pre-wrap; word-break: break-all;"></textarea>
        </div>
        <ol class="setup-steps">
          <li>Tap <strong>Copy bookmark code</strong> above</li>
          <li>In <strong>Safari</strong>, open any page, tap the <strong>Share</strong> icon &rarr; <strong>Add Bookmark</strong> &rarr; <strong>Save</strong> (it doesn't matter which page)</li>
          <li>Open your <strong>Bookmarks</strong> &rarr; tap <strong>Edit</strong> &rarr; tap the bookmark you just made</li>
          <li>Rename it <strong>Import to JED</strong>, clear its address field, <strong>paste</strong> the copied code, then tap <strong>Done</strong></li>
        </ol>
        <p class="hint" style="margin-top:10px"><strong>To use it:</strong> in <strong>Safari</strong> (not Chrome), open your ChurchSuite plan and let it load &rarr; tap the address bar and type <strong>Import to JED</strong> (or pick it from your Bookmarks) &rarr; tap it. You'll land here with the plan loaded.</p>
      </div>

      <p class="hint">Nothing is uploaded or stored. The plan data lives only in this page and disappears when you close or leave it.</p>
    </div>`;
  const bookmarkletUrl = buildBookmarklet(location.origin);
  document.getElementById('bm').href = bookmarkletUrl;
  document.getElementById('bmCode').value = bookmarkletUrl;
  const copyBtn = document.getElementById('copyBmCode');
  copyBtn.addEventListener('click', async () => {
    const ta = document.getElementById('bmCode');
    try {
      await navigator.clipboard.writeText(ta.value);
    } catch (e) {
      ta.focus(); ta.select(); document.execCommand('copy');
    }
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy bookmark code'; }, 1500);
  });
}

// ── plan view ─────────────────────────────────────────────────────────────────
function renderPlan() {
  setBreadcrumb([{label: 'Setup', action: goSetup}, {label: plan.name || 'Service'}]);
  const songs = plan.songs;
  const main = document.getElementById('main');

  if (!songs.length) { main.innerHTML = '<p>No songs found in this plan.</p>'; return; }

  const onsongCard = isIOS() ? '<div class="onsong-card" id="onsong"></div>' : '';
  main.innerHTML = onsongCard + songs.map((s, i) => {
    const pdfRows = (s.pdfs && s.pdfs.length)
      ? s.pdfs.map((p, pi) => `
          <div class="pdf-row">
            <input type="checkbox" data-name="${esc(p.name)}" data-url="${esc(p.url)}"
              data-order="${i * 100 + pi}" onchange="onCheckboxChange()">
            <span class="pdf-link" onclick="previewPdf('${esc(p.url)}', '${esc(p.name)}')">${esc(p.name)}</span>
          </div>`).join('')
      : `<div class="no-pdf">No PDFs attached</div>`;

    return `
      <div class="song">
        <div class="song-header">
          <span class="song-num">${i + 1}</span>
          <span class="song-name">${esc(s.name)}</span>
        </div>
        <div class="pdf-list">${pdfRows}</div>
        <div class="onsong-charts" id="onsong-song-${i}"></div>
      </div>`;
  }).join('') +
  `<div class="footnote">For your worship team's own CCLI-licensed use.</div>`;
}

function goSetup() {
  // Clear the hash to return to the installer view.
  history.pushState('', '', location.pathname);
  route();
}

// ── checkboxes / action bar ───────────────────────────────────────────────────
function onCheckboxChange() {
  const checked = [...document.querySelectorAll('input[type=checkbox]:checked')];
  checked.sort((a, b) => +a.dataset.order - +b.dataset.order);
  selectedPdfs = checked.map(cb => ({name: cb.dataset.name, url: cb.dataset.url}));
  updateActionBar();
}

function updateActionBar() {
  const bar = document.getElementById('action-bar');
  const count = document.getElementById('selected-count');
  if (selectedPdfs.length) {
    bar.classList.add('visible');
    count.textContent = selectedPdfs.length + ' PDF' + (selectedPdfs.length > 1 ? 's' : '') + ' selected';
  } else {
    bar.classList.remove('visible');
  }
  document.getElementById('dl-status').textContent = '';
}

// ── PDF preview ───────────────────────────────────────────────────────────────
function previewPdf(url, name) {
  document.getElementById('preview-title').textContent = name;
  document.getElementById('preview-frame').src = '/pdf?url=' + encodeURIComponent(url);
  document.getElementById('preview-panel').classList.add('open');
  document.getElementById('main').classList.add('preview-open');
  document.getElementById('action-bar').classList.add('preview-open');
}

function closePreview() {
  document.getElementById('preview-panel').classList.remove('open');
  document.getElementById('preview-frame').src = '';
  document.getElementById('main').classList.remove('preview-open');
  document.getElementById('action-bar').classList.remove('preview-open');
}

// ── merge + download (all in-browser) ─────────────────────────────────────────
async function downloadCombined() {
  const btn = document.getElementById('download-btn');
  const status = document.getElementById('dl-status');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Combining…';
  status.textContent = '';

  try {
    const { PDFDocument } = PDFLib;
    const out = await PDFDocument.create();
    for (const p of selectedPdfs) {
      // Fetch via our own same-origin proxy so the browser never makes a
      // cross-origin request (avoids CORS / extension interference entirely).
      const bytes = await fetch('/pdf?url=' + encodeURIComponent(p.url)).then(r => {
        if (!r.ok) throw new Error('Could not fetch ' + p.name);
        return r.arrayBuffer();
      });
      const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
      const pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(pg => out.addPage(pg));
    }
    const merged = await out.save();
    const blob = new Blob([merged], { type: 'application/pdf' });
    const filename = (plan && plan.date) ? ('service-' + plan.date + '.pdf') : 'service.pdf';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    status.textContent = 'Downloaded ' + filename;
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Download Combined PDF';
  }
}

// ── OnSong sync (iPad / iPhone only) ──────────────────────────────────────────
// One button that steps through: check library → import missing charts → check
// again → create the set. OnSong's URL scheme behaviour here was verified on an
// iPad with the test page in /onsong-test/:
//  - export/songs sends the whole library (ID, title, artist) back in the URL
//    fragment; it's far too big (500 KB+) for a query string. Never pass
//    `properties`: it crashes OnSong.
//  - ImportData takes a whole combined ChordPro file (tested up to ~100 KB).
//  - open/songs?song=<id>…&set=<name> creates the set in order. Songs it can't
//    find are skipped silently, which is why JED checks first.
let onsong = null;  // {library: {byTitle, count} | null, charts: {url: {title, text} | {error}}, importTapped, error}

function isIOS() {
  // iPadOS Safari reports itself as a Mac, so also check for a touch screen.
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
}

// If OnSong has just sent us its library, take the data out of the hash so a
// reload doesn't re-process it (replaceState doesn't fire hashchange).
function takeOnSongReturn() {
  const h = location.hash;
  const i = h.indexOf('&onsong=');
  if (i < 0) return null;
  history.replaceState(null, '', location.pathname + '#' + planHash());
  return h.slice(i + '&onsong='.length);
}

function initOnSong(returned) {
  if (!document.getElementById('onsong')) return;
  onsong = { library: null, charts: {}, importTapped: false, error: null };
  if (returned) {
    try {
      onsong.library = parseLibrary(returned);
    } catch (e) {
      onsong.error = 'Couldn\'t read the song list from OnSong (' + e.message + '). Try again.';
    }
  }
  renderOnSong();
  if (onsong.library) loadCharts().then(renderOnSong);
}

// Decoded, the export is tab-separated: a header row, then one row per song.
function parseLibrary(raw) {
  let b64 = raw.includes('%') ? decodeURIComponent(raw) : raw;
  b64 = b64.replace(/ /g, '+');
  b64 += '='.repeat((4 - b64.length % 4) % 4);
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const lines = new TextDecoder('utf-8').decode(bytes).split(/\r?\n/);
  const cols = lines[0].split('\t').map(c => c.trim().toLowerCase());
  const idCol = cols.indexOf('id'), titleCol = cols.indexOf('title');
  if (idCol < 0 || titleCol < 0) throw new Error('unexpected columns');

  const byTitle = new Map();
  let count = 0;
  for (const line of lines.slice(1)) {
    const cells = line.split('\t');
    const id = cells[idCol], key = titleKey(cells[titleCol]);
    if (!id || !/[\p{L}\p{N}]/u.test(key)) continue;  // skip junk rows with no readable title
    count++;
    if (!byTitle.has(key)) byTitle.set(key, []);
    byTitle.get(key).push(id);
  }
  return { byTitle, count };
}

function titleKey(title) {
  return String(title || '').normalize('NFC').replace(/[‘’]/g, "'")
    .replace(/\s+/g, ' ').trim().toLowerCase();
}

const TITLE_LINE = /^[ \t]*\{[ \t]*(?:title|t)[ \t]*:[ \t]*(.*?)[ \t]*\}[ \t]*$/mi;

// Fetch each ChordPro chart (via the same-origin proxy) to read its {title:},
// which is exactly the title OnSong gives the song when it imports it.
async function loadCharts() {
  const charts = plan.songs.flatMap(s => s.charts || []);
  await Promise.all(charts.map(async c => {
    if (onsong.charts[c.url]) return;
    try {
      const r = await fetch('/pdf?url=' + encodeURIComponent(c.url));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = (await r.text()).replace(/^﻿/, '').replace(/\r\n?/g, '\n');
      const m = text.match(TITLE_LINE);
      onsong.charts[c.url] = { text, title: (m && m[1]) || c.name.replace(/\.[^.]+$/, '') };
    } catch (e) {
      onsong.charts[c.url] = { error: e.message };
    }
  }));
}

// One entry per song that goes in the set, in service order: each chart, or
// the plan item itself (matched by its name) when it has no chart.
function onsongEntries() {
  const used = new Set();
  const lookup = title => {
    // Duplicate titles: take a copy not already used, so two charts that share a
    // title map to two different OnSong songs where possible.
    const ids = onsong.library.byTitle.get(titleKey(title)) || [];
    const id = ids.find(x => !used.has(x)) || ids[0];
    if (id) used.add(id);
    return id;
  };
  return plan.songs.flatMap((s, i) => {
    const charts = s.charts || [];
    if (!charts.length) {
      const id = lookup(s.name);
      return [{ song: i, title: s.name, id, status: id ? 'found' : 'missing', note: id ? '' : 'no chart to import' }];
    }
    return charts.map(c => {
      const data = onsong.charts[c.url];
      if (!data) return { song: i, title: c.name, status: 'loading' };
      if (data.error) return { song: i, title: c.name, status: 'missing', note: 'couldn\'t read chart' };
      const id = lookup(data.title);
      return { song: i, title: data.title, id, text: data.text, status: id ? 'found' : 'import' };
    });
  });
}

// OnSong needs each song's {title:} directly after {new_song} on the same line.
// Otherwise it gives every song after the first an extra, empty title.
function combinedChordPro(entries) {
  return entries.map(e => {
    const body = e.text.replace(new RegExp(TITLE_LINE.source + '\\n?', 'mi'), '')
      .replace(/^\n+/, '').replace(/\n*$/, '\n');
    return '{title: ' + e.title + '}\n' + body;
  }).join('{new_song}');
}

function exportUrl() {
  const back = location.origin + location.pathname + '#' + planHash() + '&onsong=';
  return 'onsong://export/songs?collection=all-songs&returnURL=' + encodeURIComponent(back);
}

function importUrl(entries) {
  const name = 'jed-' + (plan.date || 'service') + '.chordpro';
  const bytes = new TextEncoder().encode(combinedChordPro(entries));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return 'onsong://ImportData/' + encodeURIComponent(name) + '?' + btoa(bin);
}

function setName() {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(plan.date || '');
  if (!m) return plan.name || 'Service';
  return new Date(+m[1], +m[2] - 1, +m[3])
    .toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

function setUrl(entries) {
  return 'onsong://open/songs/?' +
    entries.map(e => 'song=' + encodeURIComponent(e.id)).join('&') +
    '&set=' + encodeURIComponent(setName()).replace(/%20/g, '+');
}

function renderOnSong() {
  const box = document.getElementById('onsong');
  if (!box || !onsong) return;
  const plural = n => n + ' song' + (n === 1 ? '' : 's');
  let text, btn, again = false, warn = '';

  if (!onsong.library) {
    text = onsong.error ||
      'Check which of these songs are in your OnSong library, add any that are missing, and create the set.';
    btn = { label: 'Sync to OnSong', href: exportUrl() };
  } else {
    const entries = onsongEntries();
    const count = s => entries.filter(e => e.status === s);
    const toImport = count('import'), missing = count('missing'), found = count('found');
    again = true;

    if (count('loading').length) {
      text = 'Reading the song charts…';
      btn = { label: 'Please wait', disabled: true };
      again = false;
    } else if (toImport.length && !onsong.importTapped) {
      text = found.length + ' of ' + plural(entries.length) + ' already in OnSong. ' +
        plural(toImport.length) + ' to add.';
      btn = { label: 'Import ' + plural(toImport.length), href: importUrl(toImport), onclick: 'onsongImported()' };
    } else if (toImport.length) {
      text = 'When OnSong has finished importing, come back here and check again.';
      btn = { label: 'Check again', href: exportUrl() };
      again = false;
    } else {
      text = 'All set: ' + plural(found.length) + ' will go into the set “' + setName() + '”.';
      btn = found.length
        ? { label: 'Create set in OnSong', href: setUrl(found) }
        : { label: 'Create set in OnSong', disabled: true };
    }
    if (missing.length) {
      warn = 'Not in OnSong and can\'t be added, so won\'t be in the set: ' +
        missing.map(e => '<strong>' + esc(e.title) + '</strong>' + (e.note ? ' (' + esc(e.note) + ')' : '')).join(', ');
    }
    renderOnSongCharts(entries);
  }

  if (!plan.songs.some(s => s.charts)) {
    warn += (warn ? '<br>' : '') + 'To add songs to OnSong, JED needs the updated bookmark. Open JED\'s setup page and create it again.';
  }

  box.innerHTML = `
    <div class="onsong-row">
      <div class="onsong-text"><strong>OnSong</strong>${esc(text)}</div>
      <a class="onsong-btn${btn.disabled ? ' disabled' : ''}" ${btn.href ? `href="${esc(btn.href)}"` : ''}
         ${btn.onclick ? `onclick="${btn.onclick}"` : ''}>${esc(btn.label)}</a>
    </div>
    ${again ? `<a class="onsong-again" href="${esc(exportUrl())}">Check OnSong library again</a>` : ''}
    ${warn ? `<div class="onsong-warn">${warn}</div>` : ''}`;
}

const BADGES = { found: 'In OnSong', import: 'Will be added', missing: 'Not in OnSong', loading: 'Checking…' };

function renderOnSongCharts(entries) {
  plan.songs.forEach((s, i) => {
    const el = document.getElementById('onsong-song-' + i);
    if (!el) return;
    el.innerHTML = entries.filter(e => e.song === i).map(e => `
      <div class="onsong-chart">
        <span class="badge ${e.status}">${BADGES[e.status]}</span>
        <span>${esc(e.title)}</span>
      </div>`).join('');
  });
}

function onsongImported() {
  // Let the navigation to OnSong start before swapping the button to "Check again".
  setTimeout(() => { onsong.importTapped = true; renderOnSong(); }, 300);
}

// ── helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function setBreadcrumb(parts) {
  const bc = document.getElementById('breadcrumb');
  if (!parts.length) { bc.textContent = ''; return; }
  bc.innerHTML = parts.map((p, i) =>
    i < parts.length - 1
      ? `<a onclick="${p.action.name}()">${esc(p.label)}</a> › `
      : esc(p.label)
  ).join('');
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
